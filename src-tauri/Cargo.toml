[package]
name = "soundkloud"
version = "0.1.0"
description = "A lightweight SoundCloud desktop player"
authors = ["GV"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "soundkloud_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "unstable", "image-png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(target_os = "linux")'.dependencies]
souvlaki = { version = "0.8.3", features = ["use_dbus"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
souvlaki = { version = "0.8.3", default-features = false }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
