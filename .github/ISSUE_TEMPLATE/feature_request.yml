name: Feature request
description: Suggest an improvement or a new capability
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Open this before writing a large PR. Explain the user problem first; the implementation is secondary.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is awkward or missing today? Who does it affect?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: Describe the behaviour you want. If you have an implementation idea, add it here.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Player / mini player
        - SoundCloud page / bridge
        - Media keys / Now Playing
        - Tray / window lifecycle
        - Settings / config
        - Plugins
        - Build / docs / tooling
        - Platform support
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This does not involve downloading tracks, DRM or region unlocking.
          required: true
